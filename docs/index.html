<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QRShield - URL Risk Analyzer</title>
  <link rel="stylesheet" href="style.css" />
  <!-- html5-qrcode from CDN for quick camera scanning -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>QRShield</h1>
      <p class="tagline">Scan or paste a URL to check if it's a scam.</p>
    </header>

    <section class="scanner-card">
      <div id="reader" class="camera"></div>
      <div class="manual">
        <label for="url-input">Paste URL</label>
        <input id="url-input" placeholder="https://example.com/your-link" />
        <div class="actions">
          <button id="analyze-btn" class="btn primary">Analyze</button>
          <button id="start-scan" class="btn">Start Camera</button>
          <button id="stop-scan" class="btn">Stop Camera</button>
        </div>
      </div>
    </section>

    <section id="result" class="result-card hidden">
      <div class="result-header">
        <div id="status-badge" class="badge">Status</div>
        <div class="score">
          <div class="score-number" id="risk-score">0</div>
          <div class="score-label">Risk Score</div>
        </div>
      </div>
      <div id="explanation" class="explanation">Explanation appears here.</div>
    </section>

    <div id="loader" class="loader hidden">Analyzing…</div>

    <footer>
      <small>Student MVP — QRShield</small>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
